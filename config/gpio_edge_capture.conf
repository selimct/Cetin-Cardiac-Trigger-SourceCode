# Jetson Orin Nano J12 physical pin 29 (GPIO01 / PQ.05).
chip_label=tegra234-gpio
line_offset=105

# Raw kernel-timestamped edge captures.
capture_directory=.data/edges/output
rotation_seconds=2700

# Decimal GB, matching the requested limits.
max_storage_bytes=15000000000
minimum_free_bytes=50000000000

# Capture-path buffering. At 50,000 edges/s, 262,144 records cover >5 seconds.
kernel_event_buffer_size=8192
queue_capacity=262144
sync_seconds=1

# Set a SCHED_FIFO priority only after validating permissions and the full workload.
realtime_priority=0
cpu=-1
lock_memory=true

# Deprecated pin-29 software UART decoder setting.
bit_rate_hz=38600 #40000

# Source calibration used by the deprecated live GPIO decoder and by the
# documented GPIO-to-parquet converter defaults. Raw .edges captures remain
# unchanged.
uart_ecg1_offset=2048
uart_ecg2_offset=2048
uart_puls_offset=2048
