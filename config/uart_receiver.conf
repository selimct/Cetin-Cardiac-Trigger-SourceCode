# Jetson Orin Nano J12 physical pin 10 (UART1_RXD).
# Verify the UART device name on the deployed JetPack image.
device=/dev/ttyTHS1

# The observed stream is non-inverted 8E1 at nominally 38.6 kbaud.
baud_rate=38600

# Each 26-byte logical group contains four ECG samples.
sample_rate_hz=400

# Source-specific ADC offsets are removed only from live JSONL output. Raw byte
# captures remain exact. PMU log import uses its own separate offset rules.
uart_ecg1_offset=2048
uart_ecg2_offset=2048
uart_puls_offset=2048

# Optional raw-byte captures stop cleanly at 5 decimal GB by default.
# Set this to zero only when an external storage quota is in place.
max_capture_bytes=5000000000
