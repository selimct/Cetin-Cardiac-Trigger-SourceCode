# Integrated C++ UART + TensorRT runtime. run/deploy_model.sh maintains this
# stable manifest path when activating a new model.
manifest_path=deploy/model/model.conf

# Optional live threshold control. Empty disables polling. Overrides are bound
# to the manifest's model identity and engine fingerprint.
threshold_override_path=/var/lib/dkfz-live/threshold_override.conf

# If the detection threshold is lowered, emit peaks that reached the original
# manifest threshold as soon as they fall below it. Live overrides may change
# this mode too; false restores waiting for the lower detection threshold.
early_emission=true

# J12 physical pin 10 hardware UART.
device=/dev/ttyTHS1
baud_rate=38600
sample_rate_hz=400

# Pin-10 source calibration. The raw uint16 values remain unchanged in the
# decoder/queue; these offsets are removed as doubles at the inference handoff.
# PMU log readers have separate source-specific calibration.
uart_ecg1_offset=2048
uart_ecg2_offset=2048
uart_puls_offset=2048

# Raw capture is disabled while capture_path is empty.
capture_path=
max_capture_bytes=5000000000

# Live hardware is used while replay_path is empty.
replay_path=
max_samples=0

# 2048 samples provide roughly five seconds of bounded buffering at 400 Hz.
# Overflow during live acquisition is fatal and never silently drops a sample.
queue_capacity=2048

# Structured health diagnostics are written to stderr. A pause/recovery
# transition is reported immediately; recurring status slows to once per minute
# while input is paused. Set an interval to 0 to disable status in that state.
status_interval_ms=5000
paused_status_interval_ms=60000
sid=0

# Treat the pulse ADC sentinel, pulse remaining at raw 2048, both raw ECG
# channels remaining at 2048, or raw ECG1, ECG2, and pulse remaining exactly
# unchanged as invalid input. UART silence and decoder stalls use the watchdog
# deadlines below. Every condition pauses inference and clears its accumulated
# state once; stable input resumes it with a fresh window. Set any reset duration
# to 0 to disable that value rule.
# Pulse sentinel and baseline checks apply only when the model uses pulse input
# or ecg_puls signal quality. ECG and communication checks remain active.
input_reset_enabled=true
puls_baseline_reset_ms=2000
ecg_baseline_reset_ms=2000
stuck_signal_reset_ms=2000
input_recovery_ms=2500

# Production trigger output on J12 physical pin 31 (GPIO11 / PQ.06). The
# connected input must be 3.3 V compatible. JSONL remains diagnostic-only.
trigger_output=gpio
trigger_output_queue_capacity=256
trigger_gpio_chip=tegra234-gpio
trigger_gpio_line_offset=106
trigger_gpio_active_high=true
trigger_gpio_pulse_width_us=20000
trigger_gpio_idle_width_us=20000
trigger_gpio_consumer=dkfz-live-trigger
allow_gpio_during_replay=false

# Probability records require trigger_output=jsonl or gpio+jsonl.
emit_probabilities=false

# Input liveness and internal watchdog deadlines. With input resets enabled,
# UART/decoder deadlines pause and reset inference instead of exiting. Replay
# disables UART source/decoder monitoring. Inference and output failures remain
# fatal. Set a timeout to 0 to disable that deadline.
watchdog_enabled=true
watchdog_startup_grace_ms=5000
uart_timeout_ms=2000
sample_timeout_ms=2000
inference_timeout_ms=1000
output_timeout_ms=1000

# A timed-out inference/output operation may be stuck in a vendor call and
# cannot be cancelled safely as a C++ thread. Those internal failures still exit
# immediately so systemd can restart the service; input pauses do not exit.
hard_exit_on_watchdog=true
