# Dedicated retention policy for LogNamespace=dkfz-live. Persistent logs rotate
# within 256 MiB and 14 days. The volatile fallback is capped because /run is
# normally backed by RAM.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=64M
MaxRetentionSec=14day
MaxFileSec=1day
RuntimeMaxUse=64M
RuntimeKeepFree=128M
RuntimeMaxFileSize=16M
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
